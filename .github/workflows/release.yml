name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    name: Attach tapechart.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches manifest.json
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/tapechart/manifest.json'))['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${version}" >&2
            exit 1
          fi
      - name: Zip the integration
        run: |
          cd custom_components/tapechart
          zip -r "${GITHUB_WORKSPACE}/tapechart.zip" . -x "__pycache__/*" "*.pyc"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" tapechart.zip --clobber
